service: play-backend
frameworkVersion: "^4"

# Serverless v4 ships its own ESBuild + TypeScript build. We keep `serverless-esbuild`
# (configured under custom.esbuild below) so packaging behaviour stays exactly as it
# was: one artifact per function with sourcemaps, which is what keeps us under Lambda's
# 250 MB unzipped limit. Setting this to false disables v4's built-in build.
build:
  esbuild: false

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    # Bundle the AWS SDK v3 (no node_modules packaging needed)
  authorizer:
    name: cognito-authorizer
    type: COGNITO_USER_POOLS
    arn: !GetAtt CognitoUserPool.Arn
  # Google sign-in (optional). The credentials live in SSM Parameter Store so
  # they stay out of the repo and out of shell history — write them with
  # scripts/set-google-oauth.sh. When they are missing, the Google identity
  # provider and the Hosted UI domain are not created and the service keeps
  # working with email/password sign-in only.
  #
  # The local-dev fallbacks are plain strings here rather than inline defaults:
  # Serverless v4's variable parser splits a fallback on commas and reads each
  # part as another provider, so an inline `http://a,http://b` default fails with
  # "Provider 'http is not supported".
  authDefaults:
    callbackUrls: "http://localhost:3000/auth/callback,http://localhost:3000"
    logoutUrls: "http://localhost:3000"
  auth:
    googleClientId: ${ssm:/play/auth/google-client-id, ''}
    googleClientSecret: ${ssm:/play/auth/google-client-secret, ''}
    # Comma-separated. Must match the frontend's
    # NEXT_PUBLIC_COGNITO_REDIRECT_SIGN_IN / _SIGN_OUT values.
    callbackUrls: ${ssm:/play/auth/callback-urls, self:custom.authDefaults.callbackUrls}
    logoutUrls: ${ssm:/play/auth/logout-urls, self:custom.authDefaults.logoutUrls}
  # Invitation email. The sender must be an identity SES has verified in this
  # region — write it with scripts/set-mail-sender.sh, which verifies the
  # address and stores it here. Empty (the default) means the service does not
  # send mail: invitations are still created, and the admin is handed the link.
  #
  # `appBaseUrl` is where an invitation email points. Set it to the deployed
  # frontend (`--app-url=https://…`) before inviting real people, or every
  # invitation will point at localhost.
  mailDefaults:
    fromAddress: ""
    appBaseUrl: "http://localhost:3000"
  mail:
    fromAddress: ${ssm:/play/mail/from-address, self:custom.mailDefaults.fromAddress}
    appBaseUrl: ${ssm:/play/mail/app-base-url, self:custom.mailDefaults.appBaseUrl}

# Every function is packaged on its own.
#
# Without this, `serverless-esbuild` produces one artifact for the whole service
# — every handler *and every handler's sourcemap* in a single zip — and every
# function is deployed from that same zip. Lambda caps an unzipped deployment
# package at 250 MB, and at 62 functions the service crossed it: 271 MB, of which
# 159 MB was sourcemaps. One artifact per function is ~4 MB, keeps the sourcemaps
# that make a CloudWatch stack trace readable, and means the next twenty
# functions do not bring this back.
package:
  individually: true

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  timeout: 29
  memorySize: 512

  environment:
    VIDEOS_TABLE: !Ref VideosTable
    ORGANIZATIONS_TABLE: !Ref OrganizationsTable
    ORG_MEMBERS_TABLE: !Ref OrgMembersTable
    SPACES_TABLE: !Ref SpacesTable
    SECTIONS_TABLE: !Ref SectionsTable
    CONTENTS_TABLE: !Ref ContentsTable
    CONTENT_FILES_TABLE: !Ref ContentFilesTable
    FAVOURITES_TABLE: !Ref FavouritesTable
    PLAYLIST_TABLE: !Ref PlaylistTable
    COMMENTS_TABLE: !Ref CommentsTable
    CONTENT_LOOPS_TABLE: !Ref ContentLoopsTable
    COMPLETIONS_TABLE: !Ref CompletionsTable
    VIDEOS_BUCKET: !Ref VideosBucket
    CLOUDFRONT_DOMAIN: !GetAtt VideoDistribution.DomainName
    CLOUDFRONT_KEY_PAIR_ID: !GetAtt VideoPublicKey.Id
    CLOUDFRONT_PRIVATE_KEY: ${ssm:/play/cloudfront/private-key}
    MEDIACONVERT_ROLE_ARN: !GetAtt MediaConvertRole.Arn
    TRANSCRIBE_ROLE_ARN: !GetAtt TranscribeRole.Arn
    SUBTITLE_LANGUAGE: en-US
    STREAM_URL_TTL_SECONDS: 900
    MAIL_FROM_ADDRESS: ${self:custom.mail.fromAddress}
    APP_BASE_URL: ${self:custom.mail.appBaseUrl}
    AWS_SDK_JS_NODE_VERSION_SUPPORT_WARNING_DISABLED: "true"

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt VideosTable.Arn
            - !Sub "${VideosTable.Arn}/index/*"
        # Organizations and the memberships that authorize access to them.
        # `TransactWriteItems` also needs the item-level actions it performs
        # (PutItem here) — DynamoDB authorizes the transaction and each item in
        # it separately.
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
            - dynamodb:TransactWriteItems
          Resource:
            - !GetAtt OrganizationsTable.Arn
            - !Sub "${OrganizationsTable.Arn}/index/*"
            - !GetAtt OrgMembersTable.Arn
            - !Sub "${OrgMembersTable.Arn}/index/*"
        # Spaces (courses) an organization owns.
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt SpacesTable.Arn
            - !Sub "${SpacesTable.Arn}/index/*"
        # What a space holds: its sections, the content filed under them, and the
        # files attached to that content.
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
          Resource:
            - !GetAtt SectionsTable.Arn
            - !Sub "${SectionsTable.Arn}/index/*"
            - !GetAtt ContentsTable.Arn
            - !Sub "${ContentsTable.Arn}/index/*"
            - !GetAtt ContentFilesTable.Arn
            - !Sub "${ContentFilesTable.Arn}/index/*"
        # Learner state: what a user has favourited, what is in their learning
        # playlist, and the discussion on a piece of content.
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
            - dynamodb:BatchGetItem
          Resource:
            - !GetAtt FavouritesTable.Arn
            - !Sub "${FavouritesTable.Arn}/index/*"
            - !GetAtt PlaylistTable.Arn
            - !Sub "${PlaylistTable.Arn}/index/*"
            - !GetAtt CommentsTable.Arn
            - !Sub "${CommentsTable.Arn}/index/*"
            # The indexes are separate resources as far as IAM is concerned, and
            # querying a table's index is a `Query` against the index — not
            # against the table. A table granted without its indexes is a table
            # whose listings work and whose lookups do not.
            - !GetAtt ContentLoopsTable.Arn
            - !Sub "${ContentLoopsTable.Arn}/index/*"
            - !GetAtt CompletionsTable.Arn
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - !GetAtt VideosBucket.Arn
            - !Sub "${VideosBucket.Arn}/*"
        - Effect: Allow
          Action:
            - mediaconvert:CreateJob
            - mediaconvert:GetJob
            - mediaconvert:DescribeEndpoints
          Resource: "*"
        - Effect: Allow
          Action:
            - transcribe:StartTranscriptionJob
            - transcribe:GetTranscriptionJob
          Resource: "*"
        - Effect: Allow
          Action:
            - translate:TranslateText
          Resource: "*"
        # Invitation email. The condition rather than a scoped ARN is what
        # keeps this harmless when no sender is configured: Serverless will not
        # take an `Fn::If` inside a role statement, and an ARN built from an
        # empty identity name would not resolve. With the from-address unset the
        # condition matches nothing, so the grant is inert — which is exactly the
        # state this deployment is in until scripts/set-mail-sender.sh has run.
        - Effect: Allow
          Action:
            - ses:SendEmail
          Resource: "*"
          Condition:
            StringEquals:
              ses:FromAddress: ${self:custom.mail.fromAddress}
        - Effect: Allow
          Action: iam:PassRole
          Resource:
            - !GetAtt MediaConvertRole.Arn
            - !GetAtt TranscribeRole.Arn

functions:
  create-video:
    handler: src/functions/videos/create-video.handler
    events:
      - http:
          path: videos
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  list-videos:
    handler: src/functions/videos/list-videos.handler
    events:
      - http:
          path: videos
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  get-video:
    handler: src/functions/videos/get-video.handler
    events:
      - http:
          path: videos/{videoId}
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  update-video:
    handler: src/functions/videos/update-video.handler
    events:
      - http:
          path: videos/{videoId}
          method: patch
          cors: true
          authorizer: ${self:custom.authorizer}

  delete-video:
    handler: src/functions/videos/delete-video.handler
    events:
      - http:
          path: videos/{videoId}
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  stream-video:
    handler: src/functions/videos/stream-video.handler
    events:
      - http:
          path: videos/{videoId}/stream
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  get-audio:
    handler: src/functions/videos/get-audio.handler
    events:
      - http:
          path: videos/{videoId}/audio
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  generate-audio:
    handler: src/functions/videos/generate-audio.handler
    events:
      - http:
          path: videos/{videoId}/audio
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  retry-video:
    handler: src/functions/videos/retry-video.handler
    events:
      - http:
          path: videos/{videoId}/retry
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  generate-subtitles:
    handler: src/functions/videos/generate-subtitles.handler
    events:
      - http:
          path: videos/{videoId}/subtitles
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  get-subtitles:
    handler: src/functions/videos/get-subtitles.handler
    events:
      - http:
          path: videos/{videoId}/subtitles
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  save-subtitles:
    handler: src/functions/videos/save-subtitles.handler
    events:
      - http:
          path: videos/{videoId}/subtitles
          method: put
          cors: true
          authorizer: ${self:custom.authorizer}

  generate-translations:
    handler: src/functions/videos/generate-translations.handler
    timeout: 29
    events:
      - http:
          path: videos/{videoId}/subtitles/translations
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  get-thumbnail:
    handler: src/functions/videos/get-thumbnail.handler
    events:
      - http:
          path: videos/{videoId}/thumbnail
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  upload-thumbnail:
    handler: src/functions/videos/upload-thumbnail.handler
    events:
      - http:
          path: videos/{videoId}/thumbnail
          method: put
          cors: true
          authorizer: ${self:custom.authorizer}

  generate-thumbnail:
    handler: src/functions/videos/generate-thumbnail.handler
    events:
      - http:
          path: videos/{videoId}/thumbnail/frame
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  create-organization:
    handler: src/functions/organizations/create-organization.handler
    events:
      - http:
          path: organizations
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  list-organizations:
    handler: src/functions/organizations/list-organizations.handler
    events:
      - http:
          path: organizations
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  get-organization:
    handler: src/functions/organizations/get-organization.handler
    events:
      - http:
          path: organizations/{orgId}
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  # The roster. Reading it is any member's business — knowing who else is in the
  # organization is part of being in it — while every change to it is an
  # admin's: an editor writes courses, they do not decide who is in the room.
  list-members:
    handler: src/functions/organizations/list-members.handler
    events:
      - http:
          path: organizations/{orgId}/members
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  invite-member:
    handler: src/functions/organizations/invite-member.handler
    events:
      - http:
          path: organizations/{orgId}/members
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  # A member is addressed by their own id, which is an email address until the
  # invitation is accepted — hence the path parameter being percent-encoded.
  update-member-role:
    handler: src/functions/organizations/update-member-role.handler
    events:
      - http:
          path: organizations/{orgId}/members/{userId}
          method: patch
          cors: true
          authorizer: ${self:custom.authorizer}

  remove-member:
    handler: src/functions/organizations/remove-member.handler
    events:
      - http:
          path: organizations/{orgId}/members/{userId}
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  # Sending an outstanding invitation again, to the address it was made to —
  # the answer to "they never got the email", and to "I gave them the wrong
  # role", since an offer that has not been accepted is still editable.
  resend-invitation:
    handler: src/functions/organizations/resend-invitation.handler
    events:
      - http:
          path: organizations/{orgId}/members/{userId}/invitation
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  # Claiming the invitation addressed to the caller's own verified email. Not
  # under /members, because it is not an admin acting on somebody else: it is
  # the invited person acting on an offer made to them.
  accept-invitation:
    handler: src/functions/organizations/accept-invitation.handler
    events:
      - http:
          path: organizations/{orgId}/invitation
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  # The offers addressed to the caller, wherever they came from. The one read a
  # person who belongs to nothing yet can make, and the only way they can find
  # out they were invited at all.
  list-my-invitations:
    handler: src/functions/organizations/list-my-invitations.handler
    events:
      - http:
          path: me/invitations
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  # Spaces (courses) belong to an organization, so creating and listing them is
  # addressed under the organization. Reading one back is by its own id.
  create-space:
    handler: src/functions/spaces/create-space.handler
    events:
      - http:
          path: organizations/{orgId}/spaces
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  list-spaces:
    handler: src/functions/spaces/list-spaces.handler
    events:
      - http:
          path: organizations/{orgId}/spaces
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  get-space:
    handler: src/functions/spaces/get-space.handler
    events:
      - http:
          path: spaces/{spaceId}
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  get-space-thumbnail:
    handler: src/functions/spaces/get-space-thumbnail.handler
    events:
      - http:
          path: spaces/{spaceId}/thumbnail
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  upload-space-thumbnail:
    handler: src/functions/spaces/upload-space-thumbnail.handler
    events:
      - http:
          path: spaces/{spaceId}/thumbnail
          method: put
          cors: true
          authorizer: ${self:custom.authorizer}

  # Sections — the headings a space's content is published under. Creating and
  # listing them is addressed under the space; the rest by their own id.
  create-section:
    handler: src/functions/sections/create-section.handler
    events:
      - http:
          path: spaces/{spaceId}/sections
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  list-sections:
    handler: src/functions/sections/list-sections.handler
    events:
      - http:
          # The space outline: its sections, each with the content under it.
          path: spaces/{spaceId}/sections
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  get-section:
    handler: src/functions/sections/get-section.handler
    events:
      - http:
          path: sections/{sectionId}
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  update-section:
    handler: src/functions/sections/update-section.handler
    events:
      - http:
          path: sections/{sectionId}
          method: patch
          cors: true
          authorizer: ${self:custom.authorizer}

  delete-section:
    handler: src/functions/sections/delete-section.handler
    events:
      - http:
          path: sections/{sectionId}
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  # Content — one piece of a section: a video, its notes, and its files.
  create-content:
    handler: src/functions/contents/create-content.handler
    events:
      - http:
          path: sections/{sectionId}/contents
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  list-contents:
    handler: src/functions/contents/list-contents.handler
    events:
      - http:
          path: sections/{sectionId}/contents
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  get-content:
    handler: src/functions/contents/get-content.handler
    events:
      - http:
          path: contents/{contentId}
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  update-content:
    handler: src/functions/contents/update-content.handler
    events:
      - http:
          path: contents/{contentId}
          method: patch
          cors: true
          authorizer: ${self:custom.authorizer}

  delete-content:
    handler: src/functions/contents/delete-content.handler
    events:
      - http:
          path: contents/{contentId}
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  # Files attached to a piece of content. The upload is a presigned PUT the
  # client sends straight to S3; only the reservation passes through the API.
  upload-content-file:
    handler: src/functions/contents/upload-content-file.handler
    events:
      - http:
          path: contents/{contentId}/files
          method: put
          cors: true
          authorizer: ${self:custom.authorizer}

  list-content-files:
    handler: src/functions/contents/list-content-files.handler
    events:
      - http:
          path: contents/{contentId}/files
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  get-content-file:
    handler: src/functions/contents/get-content-file.handler
    events:
      - http:
          path: contents/{contentId}/files/{fileId}
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  delete-content-file:
    handler: src/functions/contents/delete-content-file.handler
    events:
      - http:
          path: contents/{contentId}/files/{fileId}
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  # Learner state. Reading the content is all any of these needs: favouriting,
  # playlisting, and commenting are things a viewer does, not editorial acts.
  favourite-content:
    handler: src/functions/learning/favourite-content.handler
    events:
      - http:
          path: contents/{contentId}/favourite
          method: put
          cors: true
          authorizer: ${self:custom.authorizer}

  unfavourite-content:
    handler: src/functions/learning/unfavourite-content.handler
    events:
      - http:
          path: contents/{contentId}/favourite
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  add-to-playlist:
    handler: src/functions/learning/add-to-playlist.handler
    events:
      - http:
          path: contents/{contentId}/playlist
          method: put
          cors: true
          authorizer: ${self:custom.authorizer}

  remove-from-playlist:
    handler: src/functions/learning/remove-from-playlist.handler
    events:
      - http:
          path: contents/{contentId}/playlist
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  list-favourites:
    handler: src/functions/learning/list-favourites.handler
    events:
      - http:
          path: me/favourites
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  list-playlist:
    handler: src/functions/learning/list-playlist.handler
    events:
      - http:
          path: me/playlist
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  # Loops — named stretches of a lesson's video, for hearing a piece again.
  # Shared with the course; only the learner who made one may move or delete it,
  # which the key enforces rather than a check.
  create-loop:
    handler: src/functions/loops/create-loop.handler
    events:
      - http:
          path: contents/{contentId}/loops
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  list-loops:
    handler: src/functions/loops/list-loops.handler
    events:
      - http:
          path: contents/{contentId}/loops
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  update-loop:
    handler: src/functions/loops/update-loop.handler
    events:
      - http:
          path: contents/{contentId}/loops/{loopId}
          method: patch
          cors: true
          authorizer: ${self:custom.authorizer}

  delete-loop:
    handler: src/functions/loops/delete-loop.handler
    events:
      - http:
          path: contents/{contentId}/loops/{loopId}
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  # Progress: what a learner has finished. Addressed through the lesson, keyed
  # by the learner.
  complete-content:
    handler: src/functions/contents/complete-content.handler
    events:
      - http:
          path: contents/{contentId}/completion
          method: put
          cors: true
          authorizer: ${self:custom.authorizer}

  uncomplete-content:
    handler: src/functions/contents/uncomplete-content.handler
    events:
      - http:
          path: contents/{contentId}/completion
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  like-loop:
    handler: src/functions/loops/like-loop.handler
    events:
      - http:
          path: contents/{contentId}/loops/{loopId}/like
          method: put
          cors: true
          authorizer: ${self:custom.authorizer}

  unlike-loop:
    handler: src/functions/loops/unlike-loop.handler
    events:
      - http:
          path: contents/{contentId}/loops/{loopId}/like
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  # The discussion on a piece of content. Comments are addressed under their
  # content because that is the pair the table is keyed by.
  list-comments:
    handler: src/functions/comments/list-comments.handler
    events:
      - http:
          path: contents/{contentId}/comments
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  create-comment:
    handler: src/functions/comments/create-comment.handler
    events:
      - http:
          path: contents/{contentId}/comments
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  update-comment:
    handler: src/functions/comments/update-comment.handler
    events:
      - http:
          path: contents/{contentId}/comments/{commentId}
          method: patch
          cors: true
          authorizer: ${self:custom.authorizer}

  delete-comment:
    handler: src/functions/comments/delete-comment.handler
    events:
      - http:
          path: contents/{contentId}/comments/{commentId}
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  favourite-comment:
    handler: src/functions/comments/favourite-comment.handler
    events:
      - http:
          path: contents/{contentId}/comments/{commentId}/favourite
          method: put
          cors: true
          authorizer: ${self:custom.authorizer}

  unfavourite-comment:
    handler: src/functions/comments/unfavourite-comment.handler
    events:
      - http:
          path: contents/{contentId}/comments/{commentId}/favourite
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  process-video:
    handler: src/functions/processing/process-video.handler
    timeout: 60
    events:
      - s3:
          bucket: !Ref VideosBucket
          event: s3:ObjectCreated:*
          existing: true
          rules:
            - prefix: uploads/

  video-processing-complete:
    handler: src/functions/processing/video-processing-complete.handler
    timeout: 60
    events:
      - cloudwatchEvent:
          event:
            source:
              - aws.mediaconvert
            detail-type:
              - MediaConvert Job State Change
            detail:
              status:
                - COMPLETE
                - ERROR
                - CANCELED

  subtitle-generation-complete:
    handler: src/functions/processing/subtitle-generation-complete.handler
    timeout: 60
    events:
      - cloudwatchEvent:
          event:
            source:
              - aws.transcribe
            detail-type:
              - Transcribe Job State Change
            detail:
              TranscriptionJobStatus:
                - COMPLETED
                - FAILED

  # Pre sign-up trigger: gives a first-time Google sign-in the same account as an
  # existing password account with the same verified email. Wired to the user pool
  # below (see LambdaConfig) and given its own role, because the pool references
  # this function and a shared role that referenced the pool back would form a
  # CloudFormation dependency cycle.
  link-federated-user:
    handler: src/functions/auth/link-federated-user.handler
    description: Links a federated sign-in to the existing account with the same verified email
    timeout: 10
    role: !GetAtt LinkFederatedUserRole.Arn

resources:
  # Google sign-in is only wired up when credentials are present, so an existing
  # email/password-only deployment keeps working unchanged.
  Conditions:
    GoogleSignInEnabled: !And
      - !Not [!Equals ["${self:custom.auth.googleClientId}", ""]]
      - !Not [!Equals ["${self:custom.auth.googleClientSecret}", ""]]

  Resources:
    VideosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: videoId
            AttributeType: S
          - AttributeName: ownerId
            AttributeType: S
          - AttributeName: organizationId
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: N
        KeySchema:
          - AttributeName: videoId
            KeyType: HASH
        # Owner and organization key spaces deliberately mirror each other:
        # `{Prefix}CreatedIndex` lists newest-first, `{Prefix}StatusIndex`
        # filters by status. A video carries both keys, so the organization's
        # library and a single user's uploads are both a Query.
        GlobalSecondaryIndexes:
          - IndexName: OwnerStatusIndex
            KeySchema:
              - AttributeName: ownerId
                KeyType: HASH
              - AttributeName: status
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: OwnerCreatedIndex
            KeySchema:
              - AttributeName: ownerId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: OrganizationStatusIndex
            KeySchema:
              - AttributeName: organizationId
                KeyType: HASH
              - AttributeName: status
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: OrganizationCreatedIndex
            KeySchema:
              - AttributeName: organizationId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    OrganizationsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: orgId
            AttributeType: S
        KeySchema:
          - AttributeName: orgId
            KeyType: HASH

    # Who belongs to which organization, and with what role. Kept next to the
    # organizations rather than embedded in them so a member row is a single
    # item to write on invite/accept/remove, and so "my organizations" is one
    # query (UserOrgIndex) instead of a scan.
    OrgMembersTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: orgId
            AttributeType: S
          - AttributeName: userId
            AttributeType: S
          - AttributeName: joinedAt
            AttributeType: N
          - AttributeName: invitedEmail
            AttributeType: S
        KeySchema:
          - AttributeName: orgId
            KeyType: HASH
          - AttributeName: userId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: UserOrgIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: joinedAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          # An invitation is keyed by the address it was sent to, because the
          # person may not have an account yet — so the table's key cannot
          # answer "what has been sent to me?". This one can, and it is what the
          # Members page asks when it looks for offers the caller can claim.
          - IndexName: InviteEmailIndex
            KeySchema:
              - AttributeName: invitedEmail
                KeyType: HASH
              - AttributeName: joinedAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Spaces — the courses an organization publishes. Kept in its own table
    # rather than beside the organization row because a space is a growing
    # entity of its own (sections, enrollment, drip state will all hang off it),
    # and because a 400 KB organization item is a limit nobody wants to meet.
    SpacesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: spaceId
            AttributeType: S
          - AttributeName: organizationId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: N
        KeySchema:
          - AttributeName: spaceId
            KeyType: HASH
        # One index serves the whole listing story: an organization's spaces,
        # newest first. Filtering by type is a filter over that page, not a
        # separate key space, so it does not get an index of its own.
        GlobalSecondaryIndexes:
          - IndexName: OrganizationCreatedIndex
            KeySchema:
              - AttributeName: organizationId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Sections — the headings a space's content is published under. Order is a
    # decision the author makes, so it is the range key rather than createdAt;
    # `organizationId` is denormalized from the space so authorizing a section
    # (and anything under it) is one read plus the membership check.
    SectionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: sectionId
            AttributeType: S
          - AttributeName: spaceId
            AttributeType: S
          - AttributeName: position
            AttributeType: N
        KeySchema:
          - AttributeName: sectionId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: SpacePositionIndex
            KeySchema:
              - AttributeName: spaceId
                KeyType: HASH
              - AttributeName: position
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Content — one piece of a section. Two indexes, because a course is read
    # two ways: a section's own list in its authored order, and a whole space's
    # outline in one query rather than one per section.
    ContentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: contentId
            AttributeType: S
          - AttributeName: sectionId
            AttributeType: S
          - AttributeName: spaceId
            AttributeType: S
          - AttributeName: position
            AttributeType: N
        KeySchema:
          - AttributeName: contentId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: SectionPositionIndex
            KeySchema:
              - AttributeName: sectionId
                KeyType: HASH
              - AttributeName: position
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: SpacePositionIndex
            KeySchema:
              - AttributeName: spaceId
                KeyType: HASH
              - AttributeName: position
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # Files attached to a piece of content. Their own table rather than an array
    # on the content, so adding or removing one is a single item write that
    # cannot race with an edit to the notes beside it. No index: a file is only
    # ever read under the content it belongs to.
    ContentFilesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: contentId
            AttributeType: S
          - AttributeName: fileId
            AttributeType: S
        KeySchema:
          - AttributeName: contentId
            KeyType: HASH
          - AttributeName: fileId
            KeyType: RANGE

    # What each learner has favourited — content and comments in one table,
    # because the relation is the same one and a learner's own list is then a
    # single query. The count of a target's favourites is kept on the target
    # itself, so this table is never read to render one.
    FavouritesTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: targetKey
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: targetKey
            KeyType: RANGE

    # A learner's learning playlist. Keyed by content so "is this in my
    # playlist?" is one lookup and removing one is one delete; the order it was
    # added in lives in an index, because neither of those can be answered from
    # an `addedAt` key without knowing the timestamp first.
    PlaylistTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: contentId
            AttributeType: S
          - AttributeName: addedAt
            AttributeType: N
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: contentId
            KeyType: RANGE
        GlobalSecondaryIndexes:
          - IndexName: UserAddedIndex
            KeySchema:
              - AttributeName: userId
                KeyType: HASH
              - AttributeName: addedAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # The discussion on a piece of content. Keyed by content and comment so a
    # whole thread is one query; ULIDs make the key order the order things were
    # said in. No index: a comment is always read under its content.
    CommentsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: contentId
            AttributeType: S
          - AttributeName: commentId
            AttributeType: S
        KeySchema:
          - AttributeName: contentId
            KeyType: HASH
          - AttributeName: commentId
            KeyType: RANGE

    # Loops on a lesson: named stretches of the video, shared with the course.
    # Partitioned by the learner and sorted by `{contentId}#{loopId}`, so "mine"
    # is one `begins_with` query and a loop can only ever be *changed* through
    # the person who made it — which is what makes "only its maker may move it"
    # a property of the key rather than a check somebody has to remember.
    ContentLoopsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: loopKey
            AttributeType: S
          - AttributeName: contentId
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: N
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: loopKey
            KeyType: RANGE
        # Loops are shared with the course, so the lesson needs a view of them
        # that is not one learner's partition. The base table stays keyed by the
        # learner — that is what makes "mine" a query — and this is the other
        # direction: every loop on a lesson, whoever made it.
        GlobalSecondaryIndexes:
          - IndexName: ContentCreatedIndex
            KeySchema:
              - AttributeName: contentId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    # What a learner has finished. Partitioned by the learner and sorted by
    # `{spaceId}#{contentId}`, so progress through one course is a single
    # `begins_with` query and a lesson's state is one lookup inside it. No index:
    # nobody reads these except their owner, and their owner reads them a course
    # at a time.
    CompletionsTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: userId
            AttributeType: S
          - AttributeName: spaceKey
            AttributeType: S
        KeySchema:
          - AttributeName: userId
            KeyType: HASH
          - AttributeName: spaceKey
            KeyType: RANGE

    VideosBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        VersioningConfiguration:
          Status: Suspended
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods:
                - GET
                - PUT
                - HEAD
              AllowedOrigins:
                - "*"
              ExposedHeaders:
                - ETag

    VideosBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref VideosBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${VideosBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${VideoDistribution}"

    CloudFrontLogsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      Properties:
        AccessControl: LogDeliveryWrite
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerPreferred
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    VideoOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: play-videos-oac-${sls:stage}
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    VideoPublicKey:
      Type: AWS::CloudFront::PublicKey
      Properties:
        PublicKeyConfig:
          Name: play-videos-public-key-${sls:stage}
          CallerReference: play-videos-public-key-${sls:stage}
          EncodedKey: ${ssm:/play/cloudfront/public-key}

    VideoKeyGroup:
      Type: AWS::CloudFront::KeyGroup
      Properties:
        KeyGroupConfig:
          Name: play-videos-key-group-${sls:stage}
          Items:
            - !Ref VideoPublicKey

    VideoDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Comment: Play video streaming distribution
          Enabled: true
          Logging:
            Bucket: !GetAtt CloudFrontLogsBucket.DomainName
            IncludeCookies: false
            Prefix: "cloudfront/"
          PriceClass: PriceClass_100
          DefaultCacheBehavior:
            TargetOriginId: s3-videos
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            TrustedKeyGroups:
              - !Ref VideoKeyGroup
          CacheBehaviors:
            - PathPattern: /processed/*
              TargetOriginId: s3-videos
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS]
              Compress: true
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
              TrustedKeyGroups:
                - !Ref VideoKeyGroup
          Origins:
            - Id: s3-videos
              DomainName: !GetAtt VideosBucket.RegionalDomainName
              OriginAccessControlId: !Ref VideoOriginAccessControl
              S3OriginConfig: {}

    MediaConvertRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: mediaconvert.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: MediaConvertS3Access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:ListBucket
                  Resource:
                    - !GetAtt VideosBucket.Arn
                    - !Sub "${VideosBucket.Arn}/uploads/*"
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:DeleteObject
                    - s3:ListBucket
                  Resource:
                    - !GetAtt VideosBucket.Arn
                    - !Sub "${VideosBucket.Arn}/processed/*"
                # The frame-capture job writes the default thumbnail (the
                # video's first frame) here.
                - Effect: Allow
                  Action:
                    - s3:PutObject
                  Resource:
                    - !Sub "${VideosBucket.Arn}/thumbnails/*"

    TranscribeRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: transcribe.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: TranscribeS3Access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:ListBucket
                  Resource:
                    - !GetAtt VideosBucket.Arn
                    - !Sub "${VideosBucket.Arn}/uploads/*"
                - Effect: Allow
                  Action:
                    - s3:PutObject
                  Resource:
                    - !Sub "${VideosBucket.Arn}/subtitles/*"

    # Execution role for the pre sign-up linking trigger. Deliberately NOT the
    # shared lambda role: AdminLinkProviderForUser can attach an external
    # identity to any local account, so the only function that needs it is the
    # one whose entire job is to do it safely.
    #
    # The cognito-idp resource is an ARN pattern rather than
    # !GetAtt CognitoUserPool.Arn on purpose — the pool's LambdaConfig points at
    # the function, so a role that pointed back at the pool would close a
    # CloudFormation dependency cycle. Scoping to `userpool/*` in this account
    # is the closest cycle-free equivalent; the handler only touches the pool id
    # from its trigger event. The role is not conditional because the function is
    # not, and the trigger is simply left unwired when Google is disabled.
    LinkFederatedUserRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: lambda.amazonaws.com
              Action: sts:AssumeRole
        # Standard Lambda logging permissions.
        ManagedPolicyArns:
          - !Sub "arn:${AWS::Partition}:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole"
        Policies:
          - PolicyName: LinkFederatedUser
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - cognito-idp:AdminLinkProviderForUser
                    - cognito-idp:ListUsers
                  Resource: !Sub "arn:${AWS::Partition}:cognito-idp:${AWS::Region}:${AWS::AccountId}:userpool/*"

    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: play-users-${sls:stage}
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: false
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        MfaConfiguration: "OFF"
        # Runs on a federated user's first sign-in to link them to an existing
        # password account with the same email (see link-federated-user above).
        # Only attached when Google sign-in is configured.
        # `LinkDashfederatedDashuserLambdaFunction` is Serverless's logical ID for
        # the `link-federated-user` function (hyphens become "Dash").
        LambdaConfig:
          PreSignUp: !If
            - GoogleSignInEnabled
            - !GetAtt LinkDashfederatedDashuserLambdaFunction.Arn
            - !Ref "AWS::NoValue"
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true

    # Cognito requires a domain for federated sign-in: it serves the Hosted UI
    # (/oauth2/authorize) and the token endpoint (/oauth2/token) that the
    # frontend redirects to. Prefix domains share one namespace per region, so
    # the account id keeps the prefix collision-free.
    CognitoUserPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Condition: GoogleSignInEnabled
      Properties:
        Domain: !Sub "play-${sls:stage}-${AWS::AccountId}"
        UserPoolId: !Ref CognitoUserPool
        # 1 = hosted UI (classic), 2 = managed login. Managed login needs a
        # branding style, and Cognito does not apply one to app clients created
        # outside the console — so pin the classic pages, which work as-is.
        ManagedLoginVersion: 1

    # Google IdP. Register the matching redirect URI in the Google OAuth client:
    #   https://<domain>.auth.<region>.amazoncognito.com/oauth2/idpresponse
    # (the CognitoDomain stack output prints the exact value; see also
    # scripts/set-google-oauth.sh, which prints both Google console fields).
    GoogleIdentityProvider:
      Type: AWS::Cognito::UserPoolIdentityProvider
      Condition: GoogleSignInEnabled
      Properties:
        UserPoolId: !Ref CognitoUserPool
        ProviderName: Google
        ProviderType: Google
        # Cognito derives federated usernames itself (`Google_<sub>`), so
        # `username` must not be mapped. `email_verified` carries Google's
        # verification status, which Cognito can't establish on its own for a
        # mapped address. Every mapped attribute here is a standard user pool
        # attribute, which app clients can write by default.
        AttributeMapping:
          email: email
          email_verified: email_verified
          given_name: given_name
          family_name: family_name
          name: name
          picture: picture
        ProviderDetails:
          # Google takes exactly these three keys — Cognito discovers Google's
          # own endpoints (authorize_url, token_url, oidc_issuer, …) itself.
          # `attributes_request_method` is an OIDC-provider key, not a Google one.
          client_id: ${self:custom.auth.googleClientId}
          client_secret: ${self:custom.auth.googleClientSecret}
          # Google requires scopes separated by spaces.
          authorize_scopes: "email profile openid"

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        UserPoolId: !Ref CognitoUserPool
        ClientName: play-app-${sls:stage}
        GenerateSecret: false
        PreventUserExistenceErrors: ENABLED
        ExplicitAuthFlows:
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_PASSWORD_AUTH
        # Hosted UI / OAuth settings. `COGNITO` stays in the provider list so
        # email/password sign-in keeps working next to Google.
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows:
          - code
        AllowedOAuthScopes:
          - openid
          - email
          - profile
        CallbackURLs: !Split [",", "${self:custom.auth.callbackUrls}"]
        LogoutURLs: !Split [",", "${self:custom.auth.logoutUrls}"]
        # `Ref` on the provider yields its name ("Google") and, unlike a literal,
        # makes CloudFormation create it before the client — `Fn::If` is not
        # supported in `DependsOn`, so ordering has to be implicit.
        SupportedIdentityProviders:
          - COGNITO
          - !If [
              GoogleSignInEnabled,
              !Ref GoogleIdentityProvider,
              !Ref "AWS::NoValue",
            ]

    # Lets Cognito call the pre sign-up trigger. Needed because the pool is wired
    # to the function through a raw LambdaConfig property; a Serverless function
    # event would have created this automatically.
    LinkFederatedUserInvokePermission:
      Type: AWS::Lambda::Permission
      Condition: GoogleSignInEnabled
      Properties:
        Action: lambda:InvokeFunction
        FunctionName: !Ref LinkDashfederatedDashuserLambdaFunction
        Principal: cognito-idp.amazonaws.com
        SourceArn: !GetAtt CognitoUserPool.Arn

  Outputs:
    ApiUrl:
      Description: REST API base URL
      Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}"
    CognitoUserPoolId:
      Description: Cognito user pool id
      Value: !Ref CognitoUserPool
    CognitoUserPoolClientId:
      Description: Cognito app client id
      Value: !Ref CognitoUserPoolClient
    CognitoDomain:
      Description: Cognito Hosted UI domain (empty when Google sign-in is not configured)
      Value: !If
        - GoogleSignInEnabled
        - !Sub "${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
        - ""
    GoogleAuthEnabled:
      Description: Whether a Google identity provider is attached to this user pool
      Value: !If [GoogleSignInEnabled, "true", "false"]
    CloudFrontDomain:
      Description: CloudFront distribution domain
      Value: !GetAtt VideoDistribution.DomainName
    VideosBucketName:
      Description: S3 bucket name
      Value: !Ref VideosBucket
    # Exported for the maintenance scripts (see scripts/), which resolve the
    # physical table names from stack outputs. `describe-stack-resources` is not
    # usable here: it silently truncates at 100 resources on this stack and
    # returns no NextToken, so the tables never appear in it.
    VideosTableName:
      Description: Videos DynamoDB table name
      Value: !Ref VideosTable
    OrganizationsTableName:
      Description: Organizations DynamoDB table name
      Value: !Ref OrganizationsTable
    OrgMembersTableName:
