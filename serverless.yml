service: play-backend
frameworkVersion: "^3"

plugins:
  - serverless-esbuild

custom:
  esbuild:
    bundle: true
    minify: false
    sourcemap: true
    target: node22
    platform: node
    # Bundle the AWS SDK v3 (no node_modules packaging needed)
  authorizer:
    name: cognito-authorizer
    type: COGNITO_USER_POOLS
    arn: !GetAtt CognitoUserPool.Arn
  # Google sign-in (optional). The credentials live in SSM Parameter Store so
  # they stay out of the repo and out of shell history — write them with
  # scripts/set-google-oauth.sh. When they are missing, the Google identity
  # provider and the Hosted UI domain are not created and the service keeps
  # working with email/password sign-in only.
  auth:
    googleClientId: ${ssm:/play/auth/google-client-id, ''}
    googleClientSecret: ${ssm:/play/auth/google-client-secret, ''}
    # Comma-separated. Must match the frontend's
    # NEXT_PUBLIC_COGNITO_REDIRECT_SIGN_IN / _SIGN_OUT values.
    callbackUrls: ${ssm:/play/auth/callback-urls, 'http://localhost:3000/auth/callback,http://localhost:3000'}
    logoutUrls: ${ssm:/play/auth/logout-urls, 'http://localhost:3000'}

provider:
  name: aws
  runtime: nodejs22.x
  region: ${opt:region, 'us-east-1'}
  stage: ${opt:stage, 'dev'}
  timeout: 30
  memorySize: 512

  environment:
    VIDEOS_TABLE: !Ref VideosTable
    VIDEOS_BUCKET: !Ref VideosBucket
    CLOUDFRONT_DOMAIN: !GetAtt VideoDistribution.DomainName
    CLOUDFRONT_KEY_PAIR_ID: !GetAtt VideoPublicKey.Id
    CLOUDFRONT_PRIVATE_KEY: ${ssm:/play/cloudfront/private-key}
    MEDIACONVERT_ROLE_ARN: !GetAtt MediaConvertRole.Arn
    TRANSCRIBE_ROLE_ARN: !GetAtt TranscribeRole.Arn
    SUBTITLE_LANGUAGE: en-US
    STREAM_URL_TTL_SECONDS: 900
    AWS_SDK_JS_NODE_VERSION_SUPPORT_WARNING_DISABLED: "true"

  iam:
    role:
      statements:
        - Effect: Allow
          Action:
            - dynamodb:GetItem
            - dynamodb:PutItem
            - dynamodb:UpdateItem
            - dynamodb:DeleteItem
            - dynamodb:Query
          Resource:
            - !GetAtt VideosTable.Arn
            - !Sub "${VideosTable.Arn}/index/*"
        - Effect: Allow
          Action:
            - s3:GetObject
            - s3:PutObject
            - s3:DeleteObject
            - s3:ListBucket
          Resource:
            - !GetAtt VideosBucket.Arn
            - !Sub "${VideosBucket.Arn}/*"
        - Effect: Allow
          Action:
            - mediaconvert:CreateJob
            - mediaconvert:GetJob
            - mediaconvert:DescribeEndpoints
          Resource: "*"
        - Effect: Allow
          Action:
            - transcribe:StartTranscriptionJob
            - transcribe:GetTranscriptionJob
          Resource: "*"
        - Effect: Allow
          Action:
            - translate:TranslateText
          Resource: "*"
        - Effect: Allow
          Action: iam:PassRole
          Resource:
            - !GetAtt MediaConvertRole.Arn
            - !GetAtt TranscribeRole.Arn

functions:
  create-video:
    handler: src/functions/videos/create-video.handler
    events:
      - http:
          path: videos
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  list-videos:
    handler: src/functions/videos/list-videos.handler
    events:
      - http:
          path: videos
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  get-video:
    handler: src/functions/videos/get-video.handler
    events:
      - http:
          path: videos/{videoId}
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  update-video:
    handler: src/functions/videos/update-video.handler
    events:
      - http:
          path: videos/{videoId}
          method: patch
          cors: true
          authorizer: ${self:custom.authorizer}

  delete-video:
    handler: src/functions/videos/delete-video.handler
    events:
      - http:
          path: videos/{videoId}
          method: delete
          cors: true
          authorizer: ${self:custom.authorizer}

  stream-video:
    handler: src/functions/videos/stream-video.handler
    events:
      - http:
          path: videos/{videoId}/stream
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  get-audio:
    handler: src/functions/videos/get-audio.handler
    events:
      - http:
          path: videos/{videoId}/audio
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  generate-audio:
    handler: src/functions/videos/generate-audio.handler
    events:
      - http:
          path: videos/{videoId}/audio
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  retry-video:
    handler: src/functions/videos/retry-video.handler
    events:
      - http:
          path: videos/{videoId}/retry
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  generate-subtitles:
    handler: src/functions/videos/generate-subtitles.handler
    events:
      - http:
          path: videos/{videoId}/subtitles
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  get-subtitles:
    handler: src/functions/videos/get-subtitles.handler
    events:
      - http:
          path: videos/{videoId}/subtitles
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  save-subtitles:
    handler: src/functions/videos/save-subtitles.handler
    events:
      - http:
          path: videos/{videoId}/subtitles
          method: put
          cors: true
          authorizer: ${self:custom.authorizer}

  generate-translations:
    handler: src/functions/videos/generate-translations.handler
    timeout: 300
    events:
      - http:
          path: videos/{videoId}/subtitles/translations
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  get-thumbnail:
    handler: src/functions/videos/get-thumbnail.handler
    events:
      - http:
          path: videos/{videoId}/thumbnail
          method: get
          cors: true
          authorizer: ${self:custom.authorizer}

  upload-thumbnail:
    handler: src/functions/videos/upload-thumbnail.handler
    events:
      - http:
          path: videos/{videoId}/thumbnail
          method: put
          cors: true
          authorizer: ${self:custom.authorizer}

  generate-thumbnail:
    handler: src/functions/videos/generate-thumbnail.handler
    events:
      - http:
          path: videos/{videoId}/thumbnail/frame
          method: post
          cors: true
          authorizer: ${self:custom.authorizer}

  process-video:
    handler: src/functions/processing/process-video.handler
    timeout: 60
    events:
      - s3:
          bucket: !Ref VideosBucket
          event: s3:ObjectCreated:*
          existing: true
          rules:
            - prefix: uploads/

  video-processing-complete:
    handler: src/functions/processing/video-processing-complete.handler
    timeout: 60
    events:
      - cloudwatchEvent:
          event:
            source:
              - aws.mediaconvert
            detail-type:
              - MediaConvert Job State Change
            detail:
              status:
                - COMPLETE
                - ERROR
                - CANCELED

  subtitle-generation-complete:
    handler: src/functions/processing/subtitle-generation-complete.handler
    timeout: 60
    events:
      - cloudwatchEvent:
          event:
            source:
              - aws.transcribe
            detail-type:
              - Transcribe Job State Change
            detail:
              TranscriptionJobStatus:
                - COMPLETED
                - FAILED

resources:
  # Google sign-in is only wired up when credentials are present, so an existing
  # email/password-only deployment keeps working unchanged.
  Conditions:
    GoogleSignInEnabled: !And
      - !Not [!Equals ["${self:custom.auth.googleClientId}", ""]]
      - !Not [!Equals ["${self:custom.auth.googleClientSecret}", ""]]

  Resources:
    VideosTable:
      Type: AWS::DynamoDB::Table
      Properties:
        BillingMode: PAY_PER_REQUEST
        AttributeDefinitions:
          - AttributeName: videoId
            AttributeType: S
          - AttributeName: ownerId
            AttributeType: S
          - AttributeName: status
            AttributeType: S
          - AttributeName: createdAt
            AttributeType: N
        KeySchema:
          - AttributeName: videoId
            KeyType: HASH
        GlobalSecondaryIndexes:
          - IndexName: OwnerStatusIndex
            KeySchema:
              - AttributeName: ownerId
                KeyType: HASH
              - AttributeName: status
                KeyType: RANGE
            Projection:
              ProjectionType: ALL
          - IndexName: OwnerCreatedIndex
            KeySchema:
              - AttributeName: ownerId
                KeyType: HASH
              - AttributeName: createdAt
                KeyType: RANGE
            Projection:
              ProjectionType: ALL

    VideosBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      Properties:
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256
        VersioningConfiguration:
          Status: Suspended
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ["*"]
              AllowedMethods:
                - GET
                - PUT
                - HEAD
              AllowedOrigins:
                - "*"
              ExposedHeaders:
                - ETag

    VideosBucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref VideosBucket
        PolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: cloudfront.amazonaws.com
              Action: s3:GetObject
              Resource: !Sub "${VideosBucket.Arn}/*"
              Condition:
                StringEquals:
                  AWS:SourceArn: !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${VideoDistribution}"

    CloudFrontLogsBucket:
      Type: AWS::S3::Bucket
      DeletionPolicy: Retain
      Properties:
        AccessControl: LogDeliveryWrite
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerPreferred
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          IgnorePublicAcls: true
          BlockPublicPolicy: true
          RestrictPublicBuckets: true
        BucketEncryption:
          ServerSideEncryptionConfiguration:
            - ServerSideEncryptionByDefault:
                SSEAlgorithm: AES256

    VideoOriginAccessControl:
      Type: AWS::CloudFront::OriginAccessControl
      Properties:
        OriginAccessControlConfig:
          Name: play-videos-oac-${sls:stage}
          OriginAccessControlOriginType: s3
          SigningBehavior: always
          SigningProtocol: sigv4

    VideoPublicKey:
      Type: AWS::CloudFront::PublicKey
      Properties:
        PublicKeyConfig:
          Name: play-videos-public-key-${sls:stage}
          CallerReference: play-videos-public-key-${sls:stage}
          EncodedKey: ${ssm:/play/cloudfront/public-key}

    VideoKeyGroup:
      Type: AWS::CloudFront::KeyGroup
      Properties:
        KeyGroupConfig:
          Name: play-videos-key-group-${sls:stage}
          Items:
            - !Ref VideoPublicKey

    VideoDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Comment: Play video streaming distribution
          Enabled: true
          Logging:
            Bucket: !GetAtt CloudFrontLogsBucket.DomainName
            IncludeCookies: false
            Prefix: "cloudfront/"
          PriceClass: PriceClass_100
          DefaultCacheBehavior:
            TargetOriginId: s3-videos
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD, OPTIONS]
            Compress: true
            CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
            TrustedKeyGroups:
              - !Ref VideoKeyGroup
          CacheBehaviors:
            - PathPattern: /processed/*
              TargetOriginId: s3-videos
              ViewerProtocolPolicy: redirect-to-https
              AllowedMethods: [GET, HEAD, OPTIONS]
              Compress: true
              CachePolicyId: 658327ea-f89d-4fab-a63d-7e88639e58f6
              TrustedKeyGroups:
                - !Ref VideoKeyGroup
          Origins:
            - Id: s3-videos
              DomainName: !GetAtt VideosBucket.RegionalDomainName
              OriginAccessControlId: !Ref VideoOriginAccessControl
              S3OriginConfig: {}

    MediaConvertRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: mediaconvert.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: MediaConvertS3Access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:ListBucket
                  Resource:
                    - !GetAtt VideosBucket.Arn
                    - !Sub "${VideosBucket.Arn}/uploads/*"
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:PutObject
                    - s3:DeleteObject
                    - s3:ListBucket
                  Resource:
                    - !GetAtt VideosBucket.Arn
                    - !Sub "${VideosBucket.Arn}/processed/*"
                # The frame-capture job writes the default thumbnail (the
                # video's first frame) here.
                - Effect: Allow
                  Action:
                    - s3:PutObject
                  Resource:
                    - !Sub "${VideosBucket.Arn}/thumbnails/*"

    TranscribeRole:
      Type: AWS::IAM::Role
      Properties:
        AssumeRolePolicyDocument:
          Version: "2012-10-17"
          Statement:
            - Effect: Allow
              Principal:
                Service: transcribe.amazonaws.com
              Action: sts:AssumeRole
        Policies:
          - PolicyName: TranscribeS3Access
            PolicyDocument:
              Version: "2012-10-17"
              Statement:
                - Effect: Allow
                  Action:
                    - s3:GetObject
                    - s3:ListBucket
                  Resource:
                    - !GetAtt VideosBucket.Arn
                    - !Sub "${VideosBucket.Arn}/uploads/*"
                - Effect: Allow
                  Action:
                    - s3:PutObject
                  Resource:
                    - !Sub "${VideosBucket.Arn}/subtitles/*"

    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: play-users-${sls:stage}
        AdminCreateUserConfig:
          AllowAdminCreateUserOnly: false
        AutoVerifiedAttributes:
          - email
        UsernameAttributes:
          - email
        MfaConfiguration: "OFF"
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireLowercase: true
            RequireUppercase: true
            RequireNumbers: true
            RequireSymbols: false
        Schema:
          - Name: email
            AttributeDataType: String
            Required: true
            Mutable: true

    # Cognito requires a domain for federated sign-in: it serves the Hosted UI
    # (/oauth2/authorize) and the token endpoint (/oauth2/token) that the
    # frontend redirects to. Prefix domains share one namespace per region, so
    # the account id keeps the prefix collision-free.
    CognitoUserPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Condition: GoogleSignInEnabled
      Properties:
        Domain: !Sub "play-${sls:stage}-${AWS::AccountId}"
        UserPoolId: !Ref CognitoUserPool
        # 1 = hosted UI (classic), 2 = managed login. Managed login needs a
        # branding style, and Cognito does not apply one to app clients created
        # outside the console — so pin the classic pages, which work as-is.
        ManagedLoginVersion: 1

    # Google IdP. Register the matching redirect URI in the Google OAuth client:
    #   https://<domain>.auth.<region>.amazoncognito.com/oauth2/idpresponse
    # (the CognitoDomain stack output prints the exact value; see also
    # scripts/set-google-oauth.sh, which prints both Google console fields).
    GoogleIdentityProvider:
      Type: AWS::Cognito::UserPoolIdentityProvider
      Condition: GoogleSignInEnabled
      Properties:
        UserPoolId: !Ref CognitoUserPool
        ProviderName: Google
        ProviderType: Google
        # Cognito derives federated usernames itself (`Google_<sub>`), so
        # `username` must not be mapped. `email_verified` carries Google's
        # verification status, which Cognito can't establish on its own for a
        # mapped address. Every mapped attribute here is a standard user pool
        # attribute, which app clients can write by default.
        AttributeMapping:
          email: email
          email_verified: email_verified
          given_name: given_name
          family_name: family_name
          name: name
          picture: picture
        ProviderDetails:
          # Google takes exactly these three keys — Cognito discovers Google's
          # own endpoints (authorize_url, token_url, oidc_issuer, …) itself.
          # `attributes_request_method` is an OIDC-provider key, not a Google one.
          client_id: ${self:custom.auth.googleClientId}
          client_secret: ${self:custom.auth.googleClientSecret}
          # Google requires scopes separated by spaces.
          authorize_scopes: "email profile openid"

    CognitoUserPoolClient:
      Type: AWS::CognitoUserPoolClient
      Properties:
        UserPoolId: !Ref CognitoUserPool
        ClientName: play-app-${sls:stage}
        GenerateSecret: false
        PreventUserExistenceErrors: ENABLED
        ExplicitAuthFlows:
          - ALLOW_USER_SRP_AUTH
          - ALLOW_REFRESH_TOKEN_AUTH
          - ALLOW_USER_PASSWORD_AUTH
        # Hosted UI / OAuth settings. `COGNITO` stays in the provider list so
        # email/password sign-in keeps working next to Google.
        AllowedOAuthFlowsUserPoolClient: true
        AllowedOAuthFlows:
          - code
        AllowedOAuthScopes:
          - openid
          - email
          - profile
        CallbackURLs: !Split [",", "${self:custom.auth.callbackUrls}"]
        LogoutURLs: !Split [",", "${self:custom.auth.logoutUrls}"]
        # `Ref` on the provider yields its name ("Google") and, unlike a literal,
        # makes CloudFormation create it before the client — `Fn::If` is not
        # supported in `DependsOn`, so ordering has to be implicit.
        SupportedIdentityProviders:
          - COGNITO
          - !If [GoogleSignInEnabled, !Ref GoogleIdentityProvider, !Ref "AWS::NoValue"]

  Outputs:
    ApiUrl:
      Description: REST API base URL
      Value: !Sub "https://${ApiGatewayRestApi}.execute-api.${AWS::Region}.amazonaws.com/${sls:stage}"
    CognitoUserPoolId:
      Description: Cognito user pool id
      Value: !Ref CognitoUserPool
    CognitoUserPoolClientId:
      Description: Cognito app client id
      Value: !Ref CognitoUserPoolClient
    CognitoDomain:
      Description: Cognito Hosted UI domain (empty when Google sign-in is not configured)
      Value: !If
        - GoogleSignInEnabled
        - !Sub "${CognitoUserPoolDomain}.auth.${AWS::Region}.amazoncognito.com"
        - ""
    GoogleAuthEnabled:
      Description: Whether a Google identity provider is attached to this user pool
      Value: !If [GoogleSignInEnabled, "true", "false"]
    CloudFrontDomain:
      Description: CloudFront distribution domain
      Value: !GetAtt VideoDistribution.DomainName
    VideosBucketName:
      Description: S3 bucket name
      Value: !Ref VideosBucket
